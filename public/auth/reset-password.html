<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/auth/styles.css" rel="stylesheet">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card auth-card w-100">
      <div class="card-body p-4">
        <h1 class="h3 mb-2">Reset your password</h1>
        <p class="text-secondary">Choose a new password for your account.</p>
        <div id="message" class="alert d-none" role="status" aria-live="polite"></div>
        <form id="reset-password-form">
          <div class="mb-3">
            <label class="form-label" for="password">New password</label>
            <input class="form-control" id="password" name="password" type="password"
                   minlength="8" maxlength="72" autocomplete="new-password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm-password">Confirm new password</label>
            <input class="form-control" id="confirm-password" name="confirm-password" type="password"
                   minlength="8" maxlength="72" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary w-100" id="submit-button" type="submit">Reset password</button>
        </form>
        <p class="text-center mt-3 mb-0">
          <a class="link-primary text-decoration-none" href="/auth/">Back to login</a>
        </p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/auth/reset-password.js" defer></script>
</body>
</html>
