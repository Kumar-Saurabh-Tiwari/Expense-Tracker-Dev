<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/auth/styles.css" rel="stylesheet">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card auth-card w-100">
      <div class="card-body p-4">
        <header class="mb-4">
          <h1 class="h3 mb-2">Log in</h1>
          <p class="text-secondary mb-0" id="intro">Welcome back to Expense Tracker.</p>
        </header>

        <div id="message" class="alert d-none" role="status" aria-live="polite"></div>

        <form id="auth-form" data-mode="login">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email"
                   maxlength="254" placeholder="you@example.com" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password"
                   maxlength="72" placeholder="Your password" required>
          </div>
          <button class="btn btn-primary w-100" id="submit-button" type="submit">Log in</button>
        </form>

        <div class="text-center mt-3" id="forgot-password-link">
          <button class="btn btn-link btn-sm text-decoration-none p-0" id="show-forgot-password" type="button">
            Forgot password?
          </button>
        </div>

        <form id="forgot-password-form" class="d-none mt-3">
          <h2 class="h5">Reset your password</h2>
          <p class="small text-secondary">Enter your email and we’ll send you a message.</p>
          <label class="form-label" for="forgot-email">Email</label>
          <input class="form-control mb-3" id="forgot-email" name="email" type="email"
                 autocomplete="email" maxlength="254" placeholder="you@example.com" required>
          <button class="btn btn-primary w-100" id="forgot-submit-button" type="submit">Send email</button>
          <button class="btn btn-link btn-sm w-100 mt-2 text-decoration-none" id="back-to-login" type="button">
            Back to login
          </button>
        </form>

        <p class="text-center text-secondary mt-3 mb-0" id="auth-switch">
          New to Expense Tracker?
          <a class="link-primary text-decoration-none" href="/auth/signup.html">Sign up</a>
        </p>

      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/auth/auth.js" defer></script>
</body>
</html>
