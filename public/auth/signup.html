<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/auth/styles.css" rel="stylesheet">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card auth-card w-100">
      <div class="card-body p-4">
        <header class="mb-4">
          <h1 class="h3 mb-2">Create account</h1>
          <p class="text-secondary mb-0" id="intro">Sign up to start tracking your expenses.</p>
        </header>

        <div id="message" class="alert d-none" role="status" aria-live="polite"></div>

        <form id="auth-form" data-mode="register">
          <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" name="name" type="text" autocomplete="name"
                   maxlength="100" placeholder="Your name" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email"
                   maxlength="254" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="new-password"
                   minlength="8" maxlength="72" placeholder="At least 8 characters" required>
          </div>
          <button class="btn btn-primary w-100" id="submit-button" type="submit">Create account</button>
        </form>

        <p class="text-center text-secondary mt-3 mb-0" id="auth-switch">
          Already have an account?
          <a class="link-primary text-decoration-none" href="/auth/">Log in</a>
        </p>

        <div id="welcome-panel" class="d-none mt-3">
          <button class="btn btn-outline-secondary w-100" id="logout-button" type="button">Log out</button>
        </div>
      </div>
    </section>
  </main>
  <script src="/auth/auth.js" defer></script>
</body>
</html>
