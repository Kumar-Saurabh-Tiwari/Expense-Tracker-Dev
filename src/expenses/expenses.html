<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Expenses | Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/app/">Expense Tracker</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary small" id="user-name"></span>
        <button class="btn btn-outline-secondary btn-sm" id="logout-button" type="button">Log out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 760px">
    <h1 class="h3 mb-4">My expenses</h1>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Add an expense</h2>
        <div id="message" class="alert d-none" role="status" aria-live="polite"></div>
        <form id="expense-form">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="amount">Amount</label>
              <input class="form-control" id="amount" name="amount" type="number"
                     min="0.01" max="99999999.99" step="0.01" placeholder="0.00" required>
            </div>
            <div class="col-md-8">
              <label class="form-label" for="description">Description</label>
              <input class="form-control" id="description" name="description" type="text"
                     maxlength="255" placeholder="What did you spend on?" required>
            </div>
            <div class="col-md-8">
              <label class="form-label" for="category">Category</label>
              <select class="form-select" id="category" name="category" required>
                <option value="Food">Food</option>
                <option value="Petrol">Petrol</option>
                <option value="Salary">Salary</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
              <button class="btn btn-primary w-100" id="add-button" type="submit">Add expense</button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <section aria-labelledby="expense-list-title">
      <h2 class="h5 mb-3" id="expense-list-title">Your expenses</h2>
      <p class="text-secondary" id="empty-message">Loading expenses...</p>
      <ul class="list-group" id="expense-list"></ul>
    </section>
  </main>
  <script src="/app/expenses.js" defer></script>
</body>
</html>
